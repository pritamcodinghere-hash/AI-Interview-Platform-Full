spring.application.name=interviewplatform

# ==========================
# H2 Database
# ==========================
spring.datasource.url=jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# H2 Console
# ==========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================
# JWT - set via environment variable JWT_SECRET in production
# ==========================
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForInterviewPlatformProject2026SecureKey123_ChangeMeInProd_32CharsMin}
jwt.expiration=604800000

# ==========================
# OpenRouter API - set via OPENROUTER_API_KEY env
# ==========================
openrouter.api.key=${OPENROUTER_API_KEY:YOUR_OPENROUTER_API_KEY}

# ==========================
# Logging
# ==========================
logging.level.org.springframework.security=INFO
logging.level.com.aiml.interviewplatform=INFO
openrouter.max.tokens=3072

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB